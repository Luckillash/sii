<!doctype html>
<html>
<head><meta charset="utf-8"><title>EstadoDTE — vista previa</title></head>
<body>
<div id="root" class="tb-fila"></div>
<script>
  var T = window.Boleteame, h = React.createElement;
  var estados = ['borrador', 'firmado', 'enviado', 'aceptado', 'reparos', 'rechazado', 'anulado', 'incierto'];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    estados.map(function (e) { return h(T.EstadoDTE, { key: e, estado: e }); })));
</script>
</body>
</html>
