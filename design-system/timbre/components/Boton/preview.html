<!doctype html>
<html>
<head><meta charset="utf-8"><title>Boton — vista previa</title></head>
<body>
<div id="root" class="tb-pila"></div>
<script>
  var T = window.Timbre, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'tb-fila', style: { padding: 0 } },
      h(T.Boton, { variante: 'primario' }, 'Emitir factura'),
      h(T.Boton, null, 'Previsualizar PDF'),
      h(T.Boton, { variante: 'discreto' }, 'Guardar borrador'),
      h(T.Boton, { variante: 'peligro' }, 'Anular con nota de crédito')),
    h('div', { className: 'tb-fila', style: { padding: 0 } },
      h(T.Boton, { tamano: 'sm' }, 'Descargar XML'),
      h(T.Boton, { tamano: 'sm', variante: 'discreto' }, 'Copiar Track ID'),
      h(T.Boton, { tamano: 'sm', variante: 'primario', disabled: true }, 'Enviar al SII'))));
</script>
</body>
</html>
