<!-- @dsCard group="Estado" height=360 subtitle="info · éxito · aviso · error" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Alerta — vista previa</title></head>
<body>
<div id="root" style="display:flex;flex-direction:column;gap:12px;padding:16px;max-width:720px"></div>
<script>
  var T = window.Timbre, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(T.Alerta, { tono: 'info', titulo: 'Estás en el ambiente de certificación del SII' }, 'Los documentos que emitas aquí no tienen validez tributaria.'),
    h(T.Alerta, { tono: 'exito', titulo: 'El SII aceptó el set de pruebas' }, 'Sigue con la simulación: emite al menos un documento de cada tipo que vas a usar.'),
    h(T.Alerta, { tono: 'aviso', titulo: 'Tu certificado digital vence en 12 días', accion: h(T.Boton, { tamano: 'sm' }, 'Cargar certificado') }, 'Sin un certificado vigente no podrás firmar documentos.'),
    h(T.Alerta, { tono: 'error', titulo: 'El SII rechazó la factura N° 18.244', accion: h(T.Boton, { tamano: 'sm', variante: 'discreto' }, 'Ver detalle') }, 'El RUT del receptor no está inscrito como contribuyente. Corrígelo y vuelve a emitir.')));
</script>
</body>
</html>
